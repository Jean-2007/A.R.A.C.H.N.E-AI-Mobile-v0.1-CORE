name: Build A.R.A.C.H.N.E AI APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -lah
          test -f "ARACHNE-AI-Mobile-v0.1-CORE.zip"

      - name: Extract A.R.A.C.H.N.E project
        run: |
          mkdir -p extracted
          unzip -q "ARACHNE-AI-Mobile-v0.1-CORE.zip" -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts after extracting ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload A.R.A.C.H.N.E APK
        uses: actions/upload-artifact@v4
        with:
          name: ARACHNE-AI-Mobile-v0.1-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
